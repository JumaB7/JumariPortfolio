name: Build and deploy

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the API (includes in-process agent)
        run: dotnet publish PortfolioAPI/PortfolioAPI.csproj --configuration Release --output artifacts/api

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: PortfolioWebApp/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: PortfolioWebApp
        run: pnpm install --frozen-lockfile

      - name: Build the portfolio site
        working-directory: PortfolioWebApp
        run: pnpm build

      - name: Upload the API
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: artifacts/api
          if-no-files-found: error

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: PortfolioWebApp/dist/jumari-portfolio/browser
          if-no-files-found: error

  deploy-staging:
    name: Deploy UAT
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4

      - name: Put the site in the API
        run: mkdir -p api/wwwroot && cp -a site/. api/wwwroot/

      - name: Publish to UAT
        uses: azure/webapps-deploy@v3
        with:
          app-name: JumariPortfolio
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api

  deploy-production:
    name: Deploy production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4

      # Stub until PRODUCTION_HOST + publish profile exist (same pattern as Veld Supply).
      - name: Publish to production
        env:
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
        run: |
          echo "::error::Production host is $PRODUCTION_HOST, and publishing to that host is not set up yet."
          exit 1
