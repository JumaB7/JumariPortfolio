<div class="dashboard-shell">
  <aside class="dashboard-sidebar" [class.dashboard-sidebar--open]="mobileNavOpen()">
    <div class="dashboard-sidebar__brand">
      <div class="dashboard-sidebar__avatar" aria-hidden="true">JB</div>
      <div>
        <p class="m-0 text-sm font-semibold text-text-primary">Jumari Blignaut</p>
        <p class="mt-0.5 mb-0 text-xs text-text-muted">Portfolio Demo</p>
      </div>
    </div>

    <nav class="dashboard-sidebar__nav" aria-label="Dashboard sections">
      <a
        routerLink="/dashboard/financial"
        routerLinkActive="is-active"
        class="dashboard-nav-link"
        (click)="closeMobileNav()"
      >
        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 19V5M4 19h16M8 16V9M12 16v-5M16 16V7"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
          />
        </svg>
        Financial Analytics
      </a>
      <a
        routerLink="/dashboard/projects"
        routerLinkActive="is-active"
        class="dashboard-nav-link"
        (click)="closeMobileNav()"
      >
        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h10"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
          />
        </svg>
        Project Portfolio
      </a>
    </nav>

    <div class="dashboard-sidebar__footer">
      <a
        routerLink="/"
        class="dashboard-nav-link"
        (click)="closeMobileNav()"
      >
        ← Back to site
      </a>
    </div>
  </aside>

  @if (mobileNavOpen()) {
    <button
      type="button"
      class="dashboard-sidebar-backdrop"
      aria-label="Close navigation"
      (click)="closeMobileNav()"
    ></button>
  }

  <div class="dashboard-main min-w-0">
    <header class="analytics-topbar border-b border-border bg-surface/90 backdrop-blur-xl">
      <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3.5 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <button
            type="button"
            class="dashboard-menu-btn lg:hidden"
            aria-label="Open navigation"
            (click)="mobileNavOpen.set(true)"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4 7h16M4 12h16M4 17h16"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <p class="m-0 text-sm text-text-secondary">
            <span class="text-text-muted">Dashboard</span>
            <span class="mx-1.5 text-text-muted">/</span>
            <span class="text-text-primary">{{ activeSectionLabel() }}</span>
          </p>
        </div>
        <p class="m-0 text-xs font-medium tracking-[0.14em] text-accent-cyan uppercase">
          Analytics showcase
        </p>
      </div>
    </header>

    <main class="px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
      <router-outlet />
    </main>
  </div>
</div>

<button
  type="button"
  class="agent-fab fixed right-4 bottom-4 z-[60] flex h-14 w-14 items-center justify-center rounded-full border border-border-highlight bg-[linear-gradient(135deg,#0c7a96_0%,#0e8fad_100%)] text-white shadow-[0_10px_28px_rgba(8,47,73,0.45)] transition-[transform,box-shadow] hover:scale-[1.04] hover:shadow-[0_12px_32px_rgba(8,47,73,0.5)] sm:right-5 sm:bottom-5"
  [attr.aria-label]="agentOpen() ? 'Close AI agent chat' : 'Open AI agent chat'"
  [attr.aria-expanded]="agentOpen()"
  (click)="toggleAgent()"
>
  @if (agentOpen()) {
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M6 6l12 12M18 6L6 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  } @else {
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M5 12c0-3.866 3.582-7 8-7s8 3.134 8 7-3.582 7-8 7c-.74 0-1.456-.08-2.13-.23L5 19l1.35-3.38C5.5 14.7 5 13.4 5 12Z"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linejoin="round"
      />
      <circle cx="10" cy="12" r="1" fill="currentColor" />
      <circle cx="13" cy="12" r="1" fill="currentColor" />
      <circle cx="16" cy="12" r="1" fill="currentColor" />
    </svg>
  }
</button>

@if (agentOpen()) {
  <app-agent-chat-panel (closed)="closeAgent()" />
}
